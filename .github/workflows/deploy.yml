
name: Deploy Deutsch Quest v338 to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'Deutsch_Quest_v338_Progress_Backup_Extraction.zip'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate Deutsch Quest
        run: |
          mkdir -p site
          unzip -q "Deutsch_Quest_v338_Progress_Backup_Extraction.zip" -d site
          test -f site/index.html
          test -f site/backup.html
          test -f site/sw.js
          test -f site/manifest.webmanifest
          test -d site/icons

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
